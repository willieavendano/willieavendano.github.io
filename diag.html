<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site diagnostic — Willie Avendano</title>
  <style>
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    ol { padding-left: 1.4rem; }
    li { margin: 0.6rem 0; }
    .ok { color: #1a7f37; font-weight: 600; }
    .fail { color: #b3261e; font-weight: 600; }
    code { background: #f2f2f2; padding: 0 0.3em; border-radius: 3px; word-break: break-all; }
    pre { background: #f6f6f6; padding: 0.75rem; overflow: auto; font-size: 12px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Site diagnostic</h1>
  <p>Please screenshot this whole page and send it to Mr. Avendano. Course tested: <code id="course"></code></p>
  <ol id="steps"></ol>
  <pre id="ua"></pre>
  <script src="/assets/js/qlass-config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var slug = params.get('course') || 'ap-statistics';
      document.getElementById('course').textContent = slug;
      document.getElementById('ua').textContent = navigator.userAgent + '\n' + new Date().toString();
      var steps = document.getElementById('steps');
      function add(label, ok, detail) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="' + (ok ? 'ok' : 'fail') + '">' + (ok ? 'OK' : 'FAIL') + '</span> — ' + label + (detail ? ': <code></code>' : '');
        if (detail) li.querySelector('code').textContent = detail;
        steps.appendChild(li);
      }

      add('Script from cdn.jsdelivr.net (marked) loaded', typeof marked !== 'undefined',
          typeof marked !== 'undefined' ? 'marked v' + (marked.version || '?') : 'window.marked is undefined');
      add('Same-origin config script (/assets/js/qlass-config.js) loaded', !!window.QLASS,
          window.QLASS && window.QLASS.courses[slug] ? window.QLASS.courses[slug].name : 'missing');

      var url = '/' + slug + '/README.md';
      var t0 = Date.now();
      fetch(url)
        .then(function (r) {
          var ct = r.headers.get('content-type') || '(none)';
          return r.text().then(function (txt) {
            var okStatus = r.ok;
            add('Fetch ' + url + ' — HTTP ' + r.status + ' in ' + (Date.now() - t0) + ' ms', okStatus, 'content-type ' + ct + ' · ' + txt.length + ' chars');
            var looksMd = /^# /m.test(txt) || /^\*\*Tag:\*\*/m.test(txt);
            add('README body looks like the course Markdown', looksMd, txt.slice(0, 120).replace(/\s+/g, ' '));
            if (!looksMd) {
              var pre = document.createElement('pre');
              pre.textContent = 'First 600 chars of what was received:\n' + txt.slice(0, 600);
              steps.appendChild(pre);
            }
            try {
              var html = marked.parse(txt);
              add('marked.parse() on the README ran', typeof html === 'string' && html.length > 0, (html || '').length + ' chars of HTML');
            } catch (e) {
              add('marked.parse() on the README ran', false, String(e));
            }
          });
        })
        .catch(function (e) {
          add('Fetch ' + url, false, 'network error: ' + String(e));
        });
    })();
  </script>
</body>
</html>
